<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISM Embed Test — Alethic Research</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    h2 { margin-top: 0; }
    .status { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
    .loading { background: #333; }
    .ok      { background: #1a4a1a; color: #7f7; }
    .blocked { background: #4a1a1a; color: #f77; }
    iframe   { width: 100%; height: 80vh; border: 1px solid #444; border-radius: 4px; display: block; }
    .urls    { font-size: 12px; color: #888; margin-top: 16px; }
    .urls a  { color: #88aaff; }
  </style>
</head>
<body>
  <h2>ISM Embed Test — Direct-Recall Probe</h2>
  <div id="status" class="status loading">⏳ Loading iframe… (if this stays blank after ~5s the embed is blocked)</div>
  <iframe
    id="frame"
    src="https://ism.quantumwake.io/p/7yLoQenLbBVMzYvQJaNrpzqai6ewx5g8gfK3qihnUOw/graph"
    title="Direct-recall probe ISM workflow graph"
    allow="fullscreen"
  ></iframe>

  <div class="urls">
    Also test:
    <a href="iframe_test.html">Study 1</a> ·
    <a href="iframe_test2.html">Study 2</a>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var status = document.getElementById('status');
    var loaded = false;

    frame.addEventListener('load', function() {
      loaded = true;
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || doc.URL === 'about:blank') throw new Error('blank');
        status.className = 'status ok';
        status.textContent = '✅ Iframe loaded — embedding works.';
      } catch(e) {
        status.className = 'status blocked';
        status.textContent = '🚫 Iframe blocked by X-Frame-Options or CSP frame-ancestors.';
      }
    });

    setTimeout(function() {
      if (!loaded) {
        status.className = 'status blocked';
        status.textContent = '🚫 Timed out — likely blocked or network error.';
      }
    }, 8000);
  </script>
</body>
</html>
